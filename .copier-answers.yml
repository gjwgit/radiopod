  - libmpv2
summary: Privacy-first internet radio and podcast player
windows:
  appid: 7493cbba-5d0e-4f7d-af4e-ed90ced9e050
copyright: 2026, Togaware Pty Ltd
kind: app
android: true
owner: gjwgit
publisher: Togaware Pty Ltd
