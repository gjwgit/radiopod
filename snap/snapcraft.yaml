name: radiopod
version: 1.1.16
summary: Privacy preserving internet radio player.
description: |
  RadioPod plays internet radio. Find stations in the community-run
  Radio-Browser database, group them into playlists, and listen — at
  your desk, on your phone, or in the car through Android Auto.

  Your station library and playlists are stored encrypted in your
  personal online data store (Pod) within a Data Vault hosted by your
  Solid Server of choice, so nobody — not even the server
  administrator — can see what you listen to. Without a login the
  library is kept on this device instead and nothing is sent anywhere.

  Playlists import and export as M3U and PLS, the open formats every
  other radio player reads.

# 20260924 gjw Named explicitly rather than relying on snapcraft finding
# snap/gui/icon.png by convention. This is the icon the Snap Store shows
# beside the listing, and it is generated by support/make_icon.py — which
# also asserts the store's 256kB limit, so the artwork cannot quietly grow
# past what the store accepts.

icon: snap/gui/icon.png

base: core24
grade: stable
confinement: strict

# 20260921 gjw The version is taken from pubspec.yaml by the
# override-pull below rather than repeated here. A hardcoded `version:`
# has to be bumped by hand on every release and silently goes stale —
# todopod's snap version had already drifted ahead of its pubspec.

adopt-info: radiopod

apps:
  radiopod:
    command: radiopod
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      # 20260921 gjw audio-playback is what makes this a radio rather
      # than a silent station browser. Under strict confinement a snap
      # gets no sound device without it, and the failure is quiet: the
      # stream connects, the UI says Playing, and nothing is heard.
      - audio-playback

      - desktop
      - desktop-legacy
      - home
      - network
      - opengl

      # 20260924 gjw solidpod keeps the security key through
      # flutter_secure_storage, which on GNU/Linux is libsecret talking to
      # gnome-keyring over the org.freedesktop.Secret.Service D-Bus name.
      # Without this plug AppArmor blocks that call and login stops at
      # "Cannot access secure storage ... An AppArmor policy prevents this
      # sender from sending this message to this recipient".
      #
      # NOT AUTO-CONNECTED. Unlike the other plugs here this one needs
      # either a snap declaration granted by the store reviewers or, for a
      # locally installed snap, an explicit
      #
      #     snap connect radiopod:password-manager-service
      #
      # so declaring it is necessary but on its own not sufficient.
      # innerpod and the snapapp template carry it too.
      - password-manager-service

      - wayland
      - x11

    environment:
      # 20260921 gjw media_kit finds libmpv at RUNTIME with
      # DynamicLibrary.open('libmpv.so.2') — it is dlopened by name, not
      # linked — so the staged copy has to be on the loader path or
      # playback fails with "Cannot find libmpv at the usual places".
      # The gnome extension sets LD_LIBRARY_PATH for its own libraries;
      # this appends the staged arch directory holding libmpv.
      #
      # 20260924 gjw The blas and lapack directories are appended because
      # libmpv depends on libblas.so.3 and liblapack.so.3, and on Ubuntu
      # those two are chosen by update-alternatives: the real files live
      # in the blas/ and lapack/ subdirectories and the names the loader
      # looks for are symlinks in the parent, created by the alternatives
      # system when the package is INSTALLED. A snap is unpacked, not
      # installed, so those symlinks never exist and only the
      # subdirectories are staged.
      #
      # The failure is thoroughly misleading. libmpv.so.2 is present and
      # on the path, but dlopen fails to resolve its two dependencies, and
      # media_kit reports its generic "Cannot find libmpv at the usual
      # places — apt install libmpv-dev", which sends you looking for a
      # missing package on a machine that already has one. `ldd` inside
      # `snap run --shell radiopod` is what actually names the cause.
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$LD_LIBRARY_PATH

# 20260921 gjw The `flutter_secure_storage` package (and maybe
# `vault_storage`) is used by `solidpod/solidui` to save secrets
# locally, if the app provides this option to the user to do so. Thus
# `libsecret-1-dev`, `libjsoncpp-dev`, `llvm`, and `lld` at least are
# required to build the installer and `libsecret-1-0` and
# `libjsoncpp1` to run the application. See
#
# https://github.com/juliansteenbakker/flutter_secure_storage/blob/develop/README.md
# https://pub.dev/packages/vault_storage/versions/2.2.0#platform-setup
#
# 20260921 gjw RadioPod does NOT use the `audioplayers` package, so the
# gstreamer packages other apps in the suite need are deliberately
# absent. Playback here is just_audio backed by libmpv through
# just_audio_media_kit, so `libmpv2` is the runtime dependency instead.

parts:
  radiopod:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart

    build-packages:
      - binutils
      - clang
      - cmake
      - libblkid-dev
      - libgtk-3-dev
      - libjsoncpp-dev
      - liblzma-dev
      - libsecret-1-dev
      - libssl-dev
      - lld
      - llvm
      - ninja-build

    stage-packages:
      - libgtk-3-0
      - libjsoncpp-dev
      - libsecret-1-0
      - libssl3

      # 20260921 gjw libmpv2 is the whole desktop playback engine, and
      # it drags in the ffmpeg codec libraries it needs — AAC and MP3
      # cover essentially every internet radio station. Staging it is
      # what lets the snap play anything at all on a machine where the
      # user has not installed mpv themselves.
      - libmpv2
